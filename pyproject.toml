[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "market-agent"
version = "0.1.0"
description = "Taiwan stock market analysis bot powered by Claude Code"
requires-python = ">=3.12"

dependencies = [
    # Data sources
    "yfinance>=0.2.40",
    "feedparser>=6.0.11",        # RSS
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    # Technical analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b",        # TA indicators (no TA-Lib C dep)
    "scipy>=1.11.0",             # numba's LAPACK bindings for pandas-ta's JIT'd
                                  # indicators (sma/bbands) need this at runtime,
                                  # even though nothing here imports it directly
                                  # (was previously a transitive dep via
                                  # sentence-transformers/scikit-learn; dropping
                                  # that pulled scipy out too and broke this)
    # Memory & storage: local SQLite via stdlib sqlite3, no extra dependency
    # Discord bot
    "discord.py>=2.4.0",
    # Gmail
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    # Config & utilities
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",              # CLI pretty output
    "playwright>=1.60.0",
    # MCP server (Claude Code agent backend)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
market-agent = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
